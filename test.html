<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Sayfası</title>
  <style>
    :root {
      --bg: #f5f5f4;
      --surface: #ffffff;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #7c3aed;
      --border: #e7e5e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --surface: #292524;
        --text: #fafaf9;
        --muted: #a8a29e;
        --accent: #a78bfa;
        --border: #44403c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      display: flex;
      justify-content: center;
    }
    main {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 560px;
      width: 100%;
    }
    h1 { margin: 0 0 8px; font-size: 1.75rem; }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    ul { margin: 0 0 24px; padding-left: 20px; }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #cikti { margin-top: 16px; font-weight: 600; min-height: 1.6em; }
    footer { margin-top: 24px; font-size: 0.875rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Test Sayfası</h1>
    <p class="lead">Bu dosya, deponun çalıştığını doğrulamak için oluşturulmuş basit bir HTML test sayfasıdır.</p>
    <ul>
      <li>HTML5 yapısı</li>
      <li>Açık ve koyu tema desteği</li>
      <li>Küçük bir JavaScript denemesi</li>
    </ul>
    <button id="btn" type="button">Tıkla ve test et</button>
    <div id="cikti" role="status" aria-live="polite"></div>
    <footer>pskeminsoydan &middot; test.html</footer>
  </main>
  <script>
    document.getElementById('btn').addEventListener('click', function () {
      var simdi = new Date().toLocaleString('tr-TR');
      document.getElementById('cikti').textContent = 'Çalışıyor! ' + simdi;
    });
  </script>
</body>
</html>
